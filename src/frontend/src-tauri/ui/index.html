<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pussla</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Noto Sans", sans-serif;
        background:
          radial-gradient(circle at top, #fff8e8 0%, #f6f3ea 42%, #ebe7dd 100%);
        color: #27313d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(560px, calc(100vw - 48px));
        border: 1px solid rgba(39, 49, 61, 0.1);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 24px 60px rgba(39, 49, 61, 0.12);
        padding: 32px;
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: #5d6875;
      }

      #status {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 16px;
        background: #f5f7fb;
        color: #314254;
        font-size: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pussla desktop</h1>
      <p>Starting the local planning service and opening your workspace.</p>
      <div id="status">Preparing local services…</div>
    </main>
    <script>
      window.__PUSSLA_DESKTOP__ = {
        showStatus(message) {
          const el = document.getElementById("status");
          if (el) el.textContent = message;
        },
      };
    </script>
  </body>
</html>
