[package]
name = "pussla-core"
version = "0.1.0"
edition = "2021"
description = "Shared domain logic for Pussla: models, frontmatter parsing, validation, aggregation, sync."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
